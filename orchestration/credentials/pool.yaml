# Subscription-seat credential pool (specs/009-credential-pool-handoff).
#
# USAGE CONSTRAINT (binding): internal, single-operator use only. These seats
# belong to the operator running this pipeline; the pipeline and its seat pool
# are never offered to third parties (Agent SDK terms; seat rotation is a
# Consumer-Terms grey area knowingly accepted 2026-10-10). See spec.md.
#
# Only the *name* of the env var holding each seat's OAuth token lives here
# (`token_env`); the token itself lives in the worker's .env only and never
# reaches Temporal history, logs, or PR comments — seat IDs only.
#
# Override the path with CREDENTIAL_POOL_CONFIG (e.g. a two-logical-seat
# test pool pointing both seats at the same token_env).
seats:
  seat-a:
    token_env: CLAUDE_OAUTH_SEAT_A
    max_concurrent: 2
    token_expires_on: 2027-10-10

# agent -> ordered seats (order = tie-break preference); a seat listed under
# several agents is shared.
assignments:
  swe-agent: [seat-a]
  architect-agent: [seat-a]
  pm-agent: [seat-a]
