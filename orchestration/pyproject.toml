[project]
name = "orchestration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",              # webhook_bridge's HTTP server (specs/002-webhook-trigger-bridge)
    "braintrust>=0.36.0",  # imported by eval.config.py, which activities.py loads (§3.6)
    "claude-agent-sdk>=0.2.152",  # architect-agent/agent.py (loaded by activities.py) + its seat_guard need RateLimitEvent/ResultError (004, 009)
    "cryptography",         # RS256 key handling for the GitHub App JWT (webhook_bridge/github_app.py)
    "e2b",                 # Execution Sandbox the SWE-agent activity runs in (§3.3)
    "pyjwt",                # GitHub App JWT signing (webhook_bridge/github_app.py)
    "python-dotenv",        # imported by harness/architect-agent/agent.py, which activities.py loads (004)
    "pyyaml",              # registry manifest/version files the Register activity writes (§3.7)
    "temporalio>=1.32.0",  # floor pinned to the version uv.lock already resolves (research.md/H6)
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fail (not hang) a stuck Temporal test: the .claude/hooks/py-check.sh Stop
# gate and policy.sh's AF-COMMIT run this suite.
timeout = 60
markers = ["temporal: needs a live Temporal server at localhost:7233; skipped via _connect_or_skip when unreachable"]
